[package]
name = "drawkit-jni"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "drawkit_jni"
crate-type = ["cdylib"]

[dependencies]
drawkit-core = { path = "../core" }
drawkit-formats = { path = "../formats" }
drawkit-lineart = { path = "../lineart" }
jni = "0.21"
half = "2"

# The resident surface only exists on Android; the crate still builds on a host so the editor
# side can be tested.
[target.'cfg(target_os = "android")'.dependencies]
drawkit-gpu = { path = "../gpu" }

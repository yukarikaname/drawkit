[package]
name = "drawkit-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "drawkit_gpu"
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies]
half = "2"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
pollster = "0.4"
drawkit-figure = { path = "../figure" }
raw-window-handle = "0.6"
wgpu = "30"

[target.'cfg(target_os = "linux")'.dependencies]
# The dmabuf import lives in the Vulkan backend; other platforms never compile it.
wgpu-hal = { version = "30", features = ["vulkan"] }

[dev-dependencies]
drawkit-core = { path = "../core" }

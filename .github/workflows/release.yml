name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: "2.43.0"

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "release ${version}"

  macos:
    name: macOS arm64
    needs: version
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      # The kernel is built with the macOS 27 SDK. If the runner does not have
      # it, this job fails rather than publishing a bundle that cannot launch.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Every job used to save its own copy of the target directory: three matrix legs, the
          # two shells and a release build, on three operating systems. That is what reached the
          # 10 GB of caches a repository gets. One entry per runner instead, shared by the jobs
          # that build into the same target directory.
          shared-key: rust
          # Retires everything saved under the old keys.
          prefix-key: v2

      - name: Require an arm64 runner and the macOS 27 SDK
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version | grep -q '^27\.' || {
            echo "DrawKit.app needs the macOS 27 SDK; this runner has $(xcrun --sdk macosx --show-sdk-version)." >&2
            exit 1
          }

      - name: Build the app bundle
        env:
          DRAWKIT_VERSION: ${{ needs.version.outputs.value }}
        run: ./scripts/bundle-macos.sh

      - name: Package
        run: ditto -c -k --keepParent dist/DrawKit.app DrawKit-macos-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: drawkit-macos-arm64
          path: DrawKit-macos-arm64.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.value }}
          name: DrawKit ${{ needs.version.outputs.value }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          # A version with a suffix (0.0.1-alpha.1) is a pre-release: it is published, with its
          # artifacts, but it is not marked latest and GitHub says so on the release page.
          prerelease: ${{ contains(needs.version.outputs.value, '-') }}

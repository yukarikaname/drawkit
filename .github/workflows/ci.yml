name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust and desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-15
          - name: windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Linux desktop dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-xfixes0-dev libxcb-shape0-dev libxcb-xkb-dev \
            libvulkan-dev mesa-vulkan-drivers libssl-dev libdrm-dev libzstd-dev \
            libegl1-mesa-dev libgles2-mesa-dev libdbus-1-dev libasound2-dev \
            libgtk-4-dev libadwaita-1-dev

      - name: Format
        if: matrix.name == 'linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.name == 'linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Line limit (500)
        if: matrix.name == 'linux'
        run: scripts/check-size.sh

      - name: Apple string artifacts
        if: matrix.name == 'linux'
        run: |
          python3 scripts/gen-apple-strings.py
          python3 scripts/gen-apple-strings.py --check
          python3 scripts/check-strings.py

      - name: Core tests
        run: cargo test -p drawkit-core -p drawkit-formats -p drawkit-figure

      - name: Desktop build
        run: cargo build -p drawkit-core -p drawkit-gpu

      - name: GTK4 shell
        if: matrix.name == 'linux'
        run: ./scripts/build-linux.sh

  macos-shell:
    name: macOS SwiftUI shell
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build the Rust libraries
        run: MACOSX_DEPLOYMENT_TARGET=27.0 cargo build --release -p drawkit-core -p drawkit-gpu

      - name: Build the Swift package
        run: swift build --package-path app-macos

      - name: Build the Xcode targets
        run: |
          rustup target add aarch64-apple-ios-sim
          cargo build --release --target aarch64-apple-ios-sim -p drawkit-core -p drawkit-gpu
          xcodebuild -project DrawKit.xcodeproj -scheme DrawKit-macOS \
            -configuration Debug -derivedDataPath build/xcode-macos \
            CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project DrawKit.xcodeproj -scheme DrawKit-iPad \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/xcode-ios CODE_SIGNING_ALLOWED=NO build

  windows-ui:
    name: Windows WinUI 3 shell
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the Rust DLLs
        run: cargo build --release --target x86_64-pc-windows-msvc -p drawkit-core -p drawkit-gpu

      - name: Stage the DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app-windows/native | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/drawkit_core.dll app-windows/native/drawkit_core.dll
          Copy-Item target/x86_64-pc-windows-msvc/release/drawkit_gpu.dll app-windows/native/drawkit_gpu.dll

      - name: Build the WinUI app
        run: dotnet build app-windows/DrawKit.WinUI.csproj -c Release -p:Platform=x64

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Build the APK
        run: scripts/build-android.sh

      - uses: actions/upload-artifact@v7
        with:
          name: drawkit-android-debug
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
